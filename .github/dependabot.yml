version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      astro-markdown:
        patterns:
          - astro
          - "@astrojs/mdx"
          - "@astrojs/markdown-remark"
      fumadocs:
        patterns:
          - fumadocs-core
          - fumadocs-ui

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
