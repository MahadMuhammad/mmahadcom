name: Verify Astro site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify with Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan publication history for credentials
        if: matrix.node-version == '22'
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          "$RUNNER_TEMP/gitleaks" git . --log-opts="HEAD --remotes=origin" --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-no-ignore" --ignore-gitleaks-allow --redact=100 --no-banner --no-color

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use the repository npm version
        run: npm install --global --ignore-scripts npm@11.16.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies before running their code
        run: |
          npm audit
          npm audit signatures

      - name: Run approved dependency install scripts
        run: npm rebuild

      - name: Check formatting
        run: npm run format:check

      - name: Verify production build and links
        run: npm run verify

      - name: Install Chromium for accessibility checks
        if: matrix.node-version == '22'
        run: npx playwright install --with-deps chromium

      - name: Check generated pages for accessibility regressions
        if: matrix.node-version == '22'
        run: npm run check:a11y

      - name: Check Blog templates with isolated synthetic articles
        if: matrix.node-version == '22'
        run: |
          npm run check:blog
          npm run check:blog -- --theme light

      - name: Preserve verified production assets
        if: matrix.node-version == '22' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  deploy:
    name: Publish verified main
    needs: verify
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://www.mmahad.com
    steps:
      - name: Set up deployment Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install and audit the deployment tool without credentials
        run: |
          npm install --global --ignore-scripts npm@11.16.0
          mkdir -p "$RUNNER_TEMP/pages-cli" "$RUNNER_TEMP/pages-upload"
          cd "$RUNNER_TEMP/pages-cli"
          npm install --ignore-scripts --save-exact wrangler@4.129.0
          npm audit
          npm audit signatures
          ./node_modules/.bin/wrangler --version

      - name: Download this run's verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-assets
          digest-mismatch: error

      - name: Enforce static asset deployment
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "pages-assets"
          assert (root / "index.html").is_file(), "Missing built index.html"
          assert (root / "_headers").is_file(), "Missing built headers"
          assert "__GENERATED_CSP__" not in (root / "_headers").read_text(), "Unresolved CSP"
          for name in ("_worker.js", "functions", "wrangler.toml", "wrangler.json", "wrangler.jsonc", "package.json", "node_modules"):
              assert not (root / name).exists(), "Unexpected executable or config entry: " + name
          for path in root.rglob("*"):
              assert not path.is_symlink(), "Symlink in output"
              assert all(not part.startswith(".") or part == ".well-known" for part in path.relative_to(root).parts), "Unexpected hidden output"
          PY

      - name: Reject a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current_sha" = "$GITHUB_SHA"

      - name: Publish verified assets
        working-directory: ${{ runner.temp }}/pages-upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PROJECT_NAME"
          "$RUNNER_TEMP/pages-cli/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/pages-assets" --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"
